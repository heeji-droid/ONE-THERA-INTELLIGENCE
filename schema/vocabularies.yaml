# ─────────────────────────────────────────────────────────────
# ONETHERA ASSETS — onethera_relevance 판정 기준
# 이 자산과 연결되지 않으면 "none"이 정답이다
# ─────────────────────────────────────────────────────────────
onethera_assets:
  - id: pharmacist_expertise
    def: 약사 면허 기반의 성분·상호작용·안전성 판단 권위
  - id: clinical_credibility
    def: 근거 기반 커뮤니케이션 능력
  - id: formulation_access
    def: 제형 개발·생산 접근성
  - id: k_beauty_origin
    def: 한국발 제형·속도·서사
  - id: na_market_entry
    def: 북미 시장 진입 포지션
